name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    name: Types, tests et build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      # tsc -b + vite build
      - run: npm run build
